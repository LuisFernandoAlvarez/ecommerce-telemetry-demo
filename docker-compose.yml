volumes:
  grafana-storage:

networks:
  observability:

services:
  # --- Microservicios básicos ---
  users:
    build: ./Users/UserService
    ports:
      - "5091:5091"
    networks:
      - observability

  products:
    build: ./Products/ProductService
    ports:
      - "5257:5257"
    networks:
      - observability

  orders:
    build: ./Orders/OrderService
    ports:
      - "5059:5059"
    networks:
      - observability

  payments:
    build: ./Payments/PaymentService
    ports:
      - "5195:5195"
    networks:
      - observability

  inventory:
    build: ./Inventory/InventoryService
    ports:
      - "5138:5138"
    networks:
      - observability

  shipping:
    build: ./Shipping/ShippingService
    ports:
      - "5134:5134"
    networks:
      - observability

  cart:
    build: ./Cart/CartService
    ports:
      - "5151:5151"
    networks:
      - observability

  reviews:
    build: ./Reviewers/ReviewersService  
    ports:
      - "5146:5146"
    networks:
      - observability

  auth:
    build: ./Auth/AuthService
    ports:
      - "5292:5292"
    networks:
      - observability

  notifications:
    build: ./Notification/NotificationService
    ports:
      - "5121:5221"
    networks:
      - observability

  analytics:
    build: ./Analytics/AnalyticService
    ports:
      - "5126:5126"
    networks:
      - observability

  support:
    build: ./Support/SupportService
    ports:
      - "5185:5185"
    networks:
      - observability

  # --- OpenTelemetry Collector ---
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: --config=/etc/otel-collector-config.yml
    volumes:
      - /c/ecommerce-telemetry-demo/etc/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
      - "9464:9464"   # Prometheus metrics endpoint
    networks:
      - observability

  # --- Jaeger ---
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # UI
      - "14250:14250"   # gRPC
    networks:
      - observability

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - /c/ecommerce-telemetry-demo/etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - observability

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - observability
