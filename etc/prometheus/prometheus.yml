global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'users'
    static_configs:
      - targets: ['users-service:8080']

  - job_name: 'products'
    static_configs:
      - targets: ['products-service:8080']

  - job_name: 'orders'
    static_configs:
      - targets: ['orders-service:8080']

  - job_name: 'payments'
    static_configs:
      - targets: ['payments-service:8080']

  - job_name: 'inventory'
    static_configs:
      - targets: ['inventory-service:8080']

  - job_name: 'shipping'
    static_configs:
      - targets: ['shipping-service:8080']

  - job_name: 'cart'
    static_configs:
      - targets: ['cart-service:8080']

  - job_name: 'reviews'
    static_configs:
      - targets: ['reviews-service:8080']

  - job_name: 'auth'
    static_configs:
      - targets: ['auth-service:8080']

  - job_name: 'notifications'
    static_configs:
      - targets: ['notifications-service:8080']

  - job_name: 'analytics'
    static_configs:
      - targets: ['analytics-service:8080']

  - job_name: 'support'
    static_configs:
      - targets: ['support-service:8080']
