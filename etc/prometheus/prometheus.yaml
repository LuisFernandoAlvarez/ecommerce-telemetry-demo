global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # --- Scraping del OpenTelemetry Collector ---
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']

  # --- Scraping directo de microservicios (si exponen /metrics) ---
  - job_name: 'users'
    static_configs:
      - targets: ['users:80']

  - job_name: 'products'
    static_configs:
      - targets: ['products:80']

  - job_name: 'orders'
    static_configs:
      - targets: ['orders:80']

  - job_name: 'payments'
    static_configs:
      - targets: ['payments:80']

  - job_name: 'inventory'
    static_configs:
      - targets: ['inventory:80']

  - job_name: 'shipping'
    static_configs:
      - targets: ['shipping:80']

  - job_name: 'cart'
    static_configs:
      - targets: ['cart:80']

  - job_name: 'reviews'
    static_configs:
      - targets: ['reviews:80']

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:80']

  - job_name: 'notifications'
    static_configs:
      - targets: ['notifications:80']

  - job_name: 'analytics'
    static_configs:
      - targets: ['analytics:80']

  - job_name: 'support'
    static_configs:
      - targets: ['support:80']
