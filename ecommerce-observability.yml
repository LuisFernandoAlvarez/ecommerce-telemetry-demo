# -------------------------
# Microservicios
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
      - name: users
        image: lfal328/users:1.0
        ports:
        - containerPort: 5091
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users
  ports:
    - port: 5091
      targetPort: 5091
  type: ClusterIP
---
# Repite el mismo patrón para los otros 11 microservicios:
# products (5257), orders (5059), payments (5195), inventory (5138),
# shipping (5134), cart (5151), reviews (5146),
# auth (5292), notifications (5221), analytics (5126), support (5185)

# -------------------------
# Prometheus
# -------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'users'
        static_configs:
          - targets: ['users-service:5091']
      - job_name: 'products'
        static_configs:
          - targets: ['products-service:5257']
      - job_name: 'orders'
        static_configs:
          - targets: ['orders-service:5059']
      - job_name: 'payments'
        static_configs:
          - targets: ['payments-service:5195']
      - job_name: 'inventory'
        static_configs:
          - targets: ['inventory-service:5138']
      - job_name: 'shipping'
        static_configs:
          - targets: ['shipping-service:5134']
      - job_name: 'cart'
        static_configs:
          - targets: ['cart-service:5151']
      - job_name: 'reviews'
        static_configs:
          - targets: ['reviews-service:5146']
      - job_name: 'auth'
        static_configs:
          - targets: ['auth-service:5292']
      - job_name: 'notifications'
        static_configs:
          - targets: ['notifications-service:5221']
      - job_name: 'analytics'
        static_configs:
          - targets: ['analytics-service:5126']
      - job_name: 'support'
        static_configs:
          - targets: ['support-service:5185']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: NodePort

# -------------------------
# Grafana
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort
